<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泉威食品 - 敬請期待</title>
    <style>
        /* 1. 移除預設邊距並填滿全螢幕 */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000; /* 使用黑色背景，適配 9x16 圖片在長手機上的邊緣 */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* 防止出現滾動條 */
        }

        /* 2. RWD 圖片設定 */
        img {
            max-width: 100%;
            max-height: 100vh;
            display: block;
            object-fit: contain; /* 確保圖片不被裁切且維持比例 */
        }
    </style>
</head>
<body>

    <img src="comingsoon.png" alt="建置中，敬請期待">

</body>
</html>
