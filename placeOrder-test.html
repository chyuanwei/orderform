<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>泉威食品 - 訂單系統（測試）</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📋</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f0f2f5; padding: 15px; font-family: "Microsoft JhengHei", sans-serif; }
        .order-container { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        .section-title { border-left: 5px solid #06C755; padding-left: 10px; margin: 20px 0 15px 0; font-weight: bold; }
        .item-row { background: #f8f9fa; border-radius: 10px; padding: 15px; margin-bottom: 10px; border: 1px solid #e9ecef; }
        .btn-line { background-color: #06C755; color: white; border: none; font-weight: bold; }
        .btn-line:hover { background-color: #05a346; color: white; }
        .btn-outline-line { border: 1px solid #06C755; color: #06C755; background: white; font-weight: bold; }
        .readonly-field { background-color: #e9ecef !important; }
        .d-none { display: none !important; }
        .req { color: #dc3545; margin-left: 3px; font-weight: bold; }
        .confirm-box { background: #fdfdfd; border: 1px solid #eee; border-radius: 12px; padding: 20px; }
        .confirm-item { font-size: 0.95rem; border-bottom: 1px dashed #ddd; padding: 8px 0; }
        #loadingOverlay { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(255,255,255,0.8); z-index: 9999; justify-content: center; align-items: center; flex-direction: column;
        }
        .env-badge { font-size: 0.75rem; color: #856404; background: #fff3cd; padding: 2px 8px; border-radius: 4px; }
        
        /* 產品選擇模態框樣式 */
        .product-modal { 
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.5); z-index: 10000; justify-content: center; align-items: center;
        }
        .product-modal-content {
            background: white; width: 90%; max-width: 500px; max-height: 80vh; 
            border-radius: 15px; overflow: hidden; display: flex; flex-direction: column;
        }
        .product-modal-header {
            padding: 15px 20px; background: #06C755; color: white; 
            display: flex; justify-content: space-between; align-items: center;
        }
        .product-modal-body {
            padding: 15px; overflow-y: auto; flex: 1;
        }
        .product-search-input {
            width: 100%; padding: 12px; border: 2px solid #e9ecef; 
            border-radius: 8px; font-size: 16px; margin-bottom: 15px;
        }
        .product-option {
            padding: 15px; border: 1px solid #e9ecef; border-radius: 8px; 
            margin-bottom: 10px; cursor: pointer; transition: all 0.2s;
        }
        .product-option:hover { background: #f8f9fa; border-color: #06C755; }
        .product-option:active { background: #e9ecef; }
        .close-modal-btn {
            background: none; border: none; color: white; font-size: 24px; 
            cursor: pointer; padding: 0; width: 30px; height: 30px;
        }
    </style>
</head>
<body>

<div id="loadingOverlay">
    <div class="spinner-border text-success" role="status"></div>
    <p class="mt-2">系統處理中...</p>
</div>

<!-- 產品選擇模態框 -->
<div id="productModal" class="product-modal">
    <div class="product-modal-content">
        <div class="product-modal-header">
            <h5 style="margin: 0;">選擇產品</h5>
            <button class="close-modal-btn" onclick="closeProductModal()">×</button>
        </div>
        <div class="product-modal-body">
            <input type="text" id="modalSearchInput" class="product-search-input" placeholder="🔍 搜尋產品..." oninput="filterModalProducts()">
            <div id="modalProductList"></div>
        </div>
    </div>
</div>

<div class="container order-container">
    <h3 class="text-center mb-4" style="color: #06C755;">泉威食品訂購單 <span class="env-badge">測試環境</span></h3>
    
    <div id="step1">
        <form id="orderForm">
            <div class="section-title">基本資料</div>
            <div class="mb-3">
                <label class="form-label small text-muted">下單日期</label>
                <input type="date" class="form-control readonly-field" id="orderDate" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">店家名稱<span class="req">*</span></label>
                <div class="input-group">
                    <input type="text" class="form-control readonly-field" id="shopName" required placeholder="載入中..." readonly>
                    <button type="button" class="btn btn-outline-secondary" id="editShopNameBtn" style="display:none;" onclick="enableShopNameEdit()">✏️ 編輯</button>
                </div>
                <small class="text-muted" id="shopNameHint" style="display:none;">第一次使用，請填寫您的店家名稱，之後會自動帶入</small>
            </div>
            <div class="mb-3">
                <label class="form-label small text-muted">訂購人 (LINE)</label>
                <input type="text" class="form-control readonly-field" id="ordererName" readonly placeholder="載入中...">
            </div>
            <div class="mb-3">
                <label class="form-label">預計出貨日期<span class="req">*</span></label>
                <input type="date" class="form-control" id="shipDate" required>
            </div>
            <div class="mb-3">
                <label class="form-label">備註</label>
                <textarea class="form-control" id="remark" rows="2" placeholder="在此輸入備註事項"></textarea>
            </div>

            <div class="section-title">訂購項目<span class="req">*</span></div>
            <div class="mb-3">
                <label class="form-label small text-muted">分類過濾（可複選）</label>
                <div id="categoryButtons" class="d-flex flex-wrap gap-2">
                    <span class="text-muted small">載入中...</span>
                </div>
            </div>
            <div id="itemList"></div>
            <button type="button" class="btn btn-outline-line w-100 mb-4" onclick="addItemRow()">+ 增加一筆品項</button>

            <button type="submit" class="btn btn-line w-100 py-3">下一步：核對內容</button>
        </form>
    </div>

    <div id="step2" class="d-none">
        <div class="section-title">請核對您的訂單</div>
        <div class="confirm-box mb-4" id="confirmDetail"></div>
        <div class="row g-2">
            <div class="col-6">
                <button type="button" class="btn btn-outline-secondary w-100 py-2" onclick="switchStep(2, 1)">返回修改</button>
            </div>
            <div class="col-6">
                <button type="button" class="btn btn-line w-100 py-2" onclick="handleFinalSubmit()">確認送出</button>
            </div>
        </div>
    </div>

    <div id="step3" class="d-none text-center">
        <div class="py-4">
            <div class="display-4 text-success mb-3">✅</div>
            <h4 class="mb-4">訂單已送出成功！</h4>
            <div class="confirm-box text-start mb-4" id="resultSummary"></div>
            <button type="button" class="btn btn-line w-100 py-3" onclick="liff.closeWindow()">關閉視窗</button>
        </div>
    </div>
</div>

<script src="https://chyuanwei.github.io/orderform/liff-id.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
    /* 暫時註解：在 LINE 內建瀏覽器有時會在驗證過程加/刪斜線，若在 liff.init 前強行改網址易導致 liff.state 解析失敗
    (function preventTrailingSlash404() {
        var p = window.location.pathname;
        if (p && p.length > 1 && p.charAt(p.length - 1) === "/") {
            window.location.replace(window.location.origin + p.replace(/\/+$/, "") + (window.location.search || ""));
            return;
        }
    })();
    */
    var LIFF_ID = (function() {
        var urlParams = new URLSearchParams(window.location.search);
        var fromPath = getLiffIdFromUrl(window.location.hostname, window.location.pathname, null);
        var fromQuery = urlParams.get("liffId");
        var fromStorage = (typeof sessionStorage !== "undefined") ? sessionStorage.getItem("liffId") : null;
        return fromPath || fromQuery || fromStorage || "2008894056-few4uzMm";
    })();
    const GAS_URL = "https://script.google.com/macros/s/AKfycbwRDNZrsmN2yBEi35KmkpcVjN88Dtom5X7FRVhCffFeeXCWbRiDylRmbqMUV3CqX9Uz-g/exec"; 

    let productOptions = [];      // 所有產品（含 name, category）
    let allCategories = [];       // 所有分類
    let selectedCategories = [];  // 使用者選擇的分類
    let currentPayload = null;
    let userProfile = null;

    var TEST_BOT_ID = "U7d234a2a4346dc8722c343c9cde29652";
    window.onload = async function() {
        var urlParams = new URLSearchParams(window.location.search);
        try {
            var qBotId = urlParams.get("botId");
            if (qBotId) sessionStorage.setItem("liffBotId", qBotId);
            else sessionStorage.setItem("liffBotId", TEST_BOT_ID);
        } catch (e) {}

        var d = new Date();
        var today = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
        document.getElementById('orderDate').value = today;
        document.getElementById('shipDate').setAttribute('min', today);

        // 提前取得 botId，用於 fetch 產品清單時告知後端環境（測試/正式）
        var urlBotId = urlParams.get("botId") || sessionStorage.getItem("liffBotId") || TEST_BOT_ID;
        var productListPromise = fetch(GAS_URL + '?botId=' + encodeURIComponent(urlBotId)).then(function(r) { return r.json(); });

        try {
            if (!LIFF_ID) { console.error("無法取得 LIFF ID"); return; }
            await liff.init({ liffId: LIFF_ID });
            if (!liff.isLoggedIn()) {
                try {
                    sessionStorage.setItem("liffId", LIFF_ID);
                    var botId = urlParams.get("botId");
                    if (botId) sessionStorage.setItem("liffBotId", botId);
                    else sessionStorage.setItem("liffBotId", TEST_BOT_ID);
                } catch (e) {}
                liff.login();
                return;
            }

            try {
                userProfile = await liff.getProfile();
            } catch (e) {
                console.warn("getProfile 失敗，嘗試從 ID token 取得", e);
                try {
                    var idToken = liff.getDecodedIDToken && liff.getDecodedIDToken();
                    if (idToken && idToken.sub) {
                        userProfile = { userId: idToken.sub, displayName: idToken.name || "LINE用戶" };
                    }
                } catch (e2) { console.warn("getDecodedIDToken 失敗", e2); }
            }
            if (userProfile) {
                document.getElementById('ordererName').value = userProfile.displayName || "";
                
                // 查詢好友名單，自動帶入店家名稱
                try {
                    var shopNameResponse = await fetch(GAS_URL + '?action=getShopName&username=' + encodeURIComponent(userProfile.displayName || ""));
                    var shopNameData = await shopNameResponse.json();
                    if (shopNameData && shopNameData.shopName) {
                        // 找到資料：自動帶入 + 保持 readonly + 顯示編輯按鈕
                        document.getElementById('shopName').value = shopNameData.shopName;
                        document.getElementById('shopName').placeholder = '';
                        document.getElementById('editShopNameBtn').style.display = 'block';
                        console.log('已自動帶入店家名稱：' + shopNameData.shopName);
                    } else {
                        // 找不到資料：移除 readonly，讓使用者填寫
                        document.getElementById('shopName').readOnly = false;
                        document.getElementById('shopName').placeholder = '請輸入店名';
                        document.getElementById('shopNameHint').style.display = 'block';
                        console.log('未找到店家名稱，使用者需手動填寫');
                    }
                } catch (e) {
                    // 查詢失敗：移除 readonly，讓使用者填寫
                    document.getElementById('shopName').readOnly = false;
                    document.getElementById('shopName').placeholder = '請輸入店名';
                    document.getElementById('shopNameHint').style.display = 'block';
                    console.warn('查詢店家名稱失敗：' + e.message);
                }
            }

            var data = await productListPromise;
            productOptions = Array.isArray(data) ? data : [];
            
            console.log('產品資料筆數:', productOptions.length);
            console.log('產品資料範例:', productOptions.slice(0, 3));
            
            // 提取所有分類（去重）
            var categorySet = new Set();
            productOptions.forEach(function(item) {
                if (item.category) categorySet.add(item.category);
            });
            allCategories = Array.from(categorySet);
            
            console.log('提取的分類:', allCategories);
            
            // 初始化分類過濾選單
            initCategoryFilter();
            
            addItemRow();
        } catch (err) {
            console.error(err);
            try {
                if (LIFF_ID) { sessionStorage.setItem("liffId", LIFF_ID); }
                var botId = new URLSearchParams(window.location.search).get("botId");
                if (botId) sessionStorage.setItem("liffBotId", botId);
                if (typeof liff !== "undefined" && liff.login) { liff.login(); return; }
            } catch (e) { console.warn("liff.login 失敗", e); }
            document.querySelector('.order-container h3').insertAdjacentHTML('afterend', '<p class="text-danger small">系統初始化失敗，請從 LINE 圖文選單重新進入。</p>');
        }
    };

    var currentEditingRowId = null; // 記錄當前正在編輯的列

    function addItemRow() {
        const container = document.getElementById('itemList');
        const rowId = 'row_' + Date.now() + Math.floor(Math.random() * 1000);
        const rowHtml = `
            <div class="item-row" id="${rowId}">
                <div class="row g-2">
                    <div class="col-7">
                        <input type="text" 
                               class="form-control product-input" 
                               placeholder="點擊選擇產品..."
                               required 
                               readonly
                               data-row-id="${rowId}"
                               onclick="openProductModal('${rowId}')">
                    </div>
                    <div class="col-3">
                        <input type="number" class="form-control product-count" value="1" min="1" required>
                    </div>
                    <div class="col-2 text-end">
                        <button type="button" class="btn btn-outline-danger btn-sm" onclick="removeRow('${rowId}')">✕</button>
                    </div>
                </div>
            </div>`;
        container.insertAdjacentHTML('beforeend', rowHtml);
    }

    // 初始化分類過濾按鈕
    function initCategoryFilter() {
        var container = document.getElementById('categoryButtons');
        container.innerHTML = '';
        
        allCategories.forEach(function(cat) {
            var btn = document.createElement('button');
            btn.type = 'button';
            btn.className = 'btn btn-outline-primary btn-sm';
            btn.textContent = cat;
            btn.setAttribute('data-category', cat);
            btn.onclick = function() { toggleCategory(cat); };
            container.appendChild(btn);
        });
    }
    
    // 切換分類選擇
    function toggleCategory(category) {
        var btn = document.querySelector('[data-category="' + category.replace(/"/g, '\\"') + '"]');
        if (!btn) {
            console.error('找不到按鈕：', category);
            return;
        }
        
        var idx = selectedCategories.indexOf(category);
        console.log('切換分類：', category, '當前狀態：', idx === -1 ? '未選中' : '已選中');
        
        if (idx === -1) {
            // 未選中 → 選中
            selectedCategories.push(category);
            btn.className = 'btn btn-primary btn-sm';
            console.log('設定為已選中，className:', btn.className);
        } else {
            // 已選中 → 取消
            selectedCategories.splice(idx, 1);
            btn.className = 'btn btn-outline-primary btn-sm';
            console.log('設定為未選中，className:', btn.className);
        }
        
        // 強制重繪（手機瀏覽器修正）
        btn.style.display = 'none';
        btn.offsetHeight; // 觸發 reflow
        btn.style.display = '';
        
        console.log('當前已選分類：', selectedCategories);
        updateAllProductSelects();
    }

    // 開啟產品選擇模態框
    function openProductModal(rowId) {
        if (selectedCategories.length === 0) {
            alert('請先選擇分類');
            return;
        }
        
        currentEditingRowId = rowId;
        var modal = document.getElementById('productModal');
        var searchInput = document.getElementById('modalSearchInput');
        
        searchInput.value = '';
        renderModalProducts('');
        
        modal.style.display = 'flex';
    }
    
    // 關閉產品選擇模態框
    function closeProductModal() {
        var modal = document.getElementById('productModal');
        modal.style.display = 'none';
        currentEditingRowId = null;
    }
    
    // 渲染模態框中的產品清單
    function renderModalProducts(searchKeyword) {
        var container = document.getElementById('modalProductList');
        var keyword = searchKeyword || '';
        
        var filtered = productOptions.filter(function(item) {
            var matchCategory = selectedCategories.includes(item.category);
            var matchSearch = keyword === '' || item.name.toLowerCase().includes(keyword.toLowerCase());
            return matchCategory && matchSearch;
        });
        
        if (filtered.length === 0) {
            container.innerHTML = '<p class="text-muted text-center">查無符合的產品</p>';
        } else {
            container.innerHTML = filtered.map(function(p) {
                return '<div class="product-option" onclick="selectProduct(\'' + p.name.replace(/'/g, "\\'") + '\')">' + p.name + '</div>';
            }).join('');
        }
    }
    
    // 過濾模態框中的產品
    function filterModalProducts() {
        var keyword = document.getElementById('modalSearchInput').value;
        renderModalProducts(keyword);
    }
    
    // 選擇產品
    function selectProduct(productName) {
        if (!currentEditingRowId) return;
        
        var input = document.querySelector('#' + currentEditingRowId + ' .product-input');
        if (input) {
            input.value = productName;
        }
        
        closeProductModal();
    }
    
    // 更新所有品項（分類變更時）- 不需要做任何事，因為模態框會即時過濾
    function updateAllProductSelects() {
        // 保留此函式，以免其他地方有呼叫
    }

    function removeRow(id) {
        if (document.querySelectorAll('.item-row').length > 1) document.getElementById(id).remove();
    }

    function switchStep(from, to) {
        document.getElementById('step' + from).classList.add('d-none');
        document.getElementById('step' + to).classList.remove('d-none');
        window.scrollTo(0, 0);
    }

    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        try {
            const items = [];
            document.querySelectorAll('.item-row').forEach(row => {
                items.push({
                    name: row.querySelector('.product-input').value,
                    count: row.querySelector('.product-count').value
                });
            });
            const urlParams = new URLSearchParams(window.location.search);
            const botIdFromUrl = urlParams.get('botId') || (typeof sessionStorage !== "undefined" ? sessionStorage.getItem("liffBotId") : null) || TEST_BOT_ID;
            const isPc = !/Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent);
            currentPayload = {
                destination: botIdFromUrl,
                orderDate: document.getElementById('orderDate').value,
                shopName: document.getElementById('shopName').value,
                ordererName: document.getElementById('ordererName').value,
                shipDate: document.getElementById('shipDate').value,
                remark: document.getElementById('remark').value,
                items: items,
                userId: userProfile ? userProfile.userId : "",
                isPc: isPc
            };

            renderSummary('confirmDetail');
            switchStep(1, 2);
        } catch (err) {
            alert("預覽發生錯誤：" + err.message);
        }
    });

    function renderSummary(elementId) {
        let itemsHtml = currentPayload.items.map(i => `<div class="confirm-item d-flex justify-content-between"><span>${i.name}</span><span class="fw-bold">x ${i.count}</span></div>`).join('');
        document.getElementById(elementId).innerHTML = `
            <div class="mb-2 small"><b>店家：</b>${currentPayload.shopName}</div>
            <div class="mb-2 small"><b>出貨日：</b>${currentPayload.shipDate}</div>
            <div class="mb-2 small"><b>備註：</b>${currentPayload.remark || '無'}</div>
            <div class="mb-3 small border-bottom pb-2"><b>訂購人：</b>${currentPayload.ordererName}</div>
            <div>${itemsHtml}</div>
        `;
    }

async function handleFinalSubmit() {
        const overlay = document.getElementById('loadingOverlay');
        overlay.style.display = 'flex';

        fetch(GAS_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain" },
            body: JSON.stringify(currentPayload)
        }).then(response => response.text())
            .then(data => console.log("GAS 回應:", data))
            .catch(err => console.error("傳送失敗:", err));

        setTimeout(async () => {
            overlay.style.display = 'none';
            renderSummary('resultSummary');
            switchStep(2, 3);

            if (liff.isInClient()) {
                const itemsMsg = currentPayload.items.map(i => `・${i.name} x ${i.count}`).join('\n');
                const fullMsg = `【Line表單-測試】訂單已送出：\n--------------------\n下單日期：${currentPayload.orderDate}\n店家名稱：${currentPayload.shopName}\n訂購人：${currentPayload.ordererName}\n預計出貨日：${currentPayload.shipDate}\n備註：${currentPayload.remark || '無'}\n--------------------\n訂購明細：\n${itemsMsg}`;

                try {
                    await liff.sendMessages([{
                        type: 'text',
                        text: fullMsg
                    }]);
                    console.log("訊息傳送成功");
                } catch (err) {
                    console.error("訊息傳送失敗:", err);
                    alert("訂單已記錄，但無法發送對帳訊息。");
                }
            }
        }, 800);
    }

    // 啟用店家名稱編輯
    function enableShopNameEdit() {
        if (confirm('修改後，下次會使用新的店家名稱。確定要修改嗎？')) {
            document.getElementById('shopName').readOnly = false;
            document.getElementById('shopName').focus();
            document.getElementById('editShopNameBtn').style.display = 'none';
        }
    }
</script>
</body>
</html>
