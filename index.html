<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>泉威食品 - 系統跳轉中</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; background: #f4f4f4; }
        .loader { text-align: center; }
        .spinner { border: 4px solid rgba(0,0,0,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #09d; animation: spin 1s linear infinite; margin: 0 auto 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="loader">
        <div class="spinner"></div>
        <p>系統跳轉中，請稍候...</p>
    </div>

    <script src="https://chyuanwei.github.io/orderform/liff-id.js"></script>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script>
        var PLACE_ORDER_PAGE = "placeOrder.html";

        async function main() {
            var urlParams = new URLSearchParams(window.location.search);
            var hasOAuthCallback = urlParams.has("code") || urlParams.has("state");
            var fromPath = getLiffIdFromUrl(window.location.hostname, window.location.pathname, null);
            var fromQuery = urlParams.get("liffId");
            var liffId = fromPath || fromQuery || "2008894056-few4uzMm";

            try {
                if (!liffId) { document.querySelector('p').innerText = "無法取得 LIFF ID，請從 LINE 圖文選單進入。"; return; }
                await liff.init({ liffId: liffId });

                if (!liff.isLoggedIn()) {
                    liff.login();
                    return;
                }

                goToPlaceOrder(urlParams, liffId);
            } catch (error) {
                console.error("LIFF 初始化失敗", error);
                if (hasOAuthCallback) {
                    // 登入後帶 code 回來卻 init 失敗：仍嘗試轉訂單頁（session 可能已寫入）
                    goToPlaceOrder(urlParams, liffId);
                } else {
                    document.querySelector('p').innerText = "系統初始化失敗，請稍後再試。";
                }
            }
        }

        function goToPlaceOrder(urlParams, liffId) {
            var params = [];
            if (liffId) params.push("liffId=" + encodeURIComponent(liffId));
            var botId = urlParams.get("botId");
            if (botId) params.push("botId=" + encodeURIComponent(botId));
            var targetQuery = params.length ? "?" + params.join("&") : "";
            window.location.href = PLACE_ORDER_PAGE + targetQuery;
        }

        main();
    </script>
</body>
</html>
